# Builds and checks the Mac version on GitHub's Mac machines (no Mac needed).
# Runs only if this folder is pushed to its own GitHub repo.
name: mac
on: [push, workflow_dispatch]
permissions:
  contents: write          # to publish the built app as a (private) release
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: unit tests + simulated-Mac tests
        run: python -m unittest tests.test_engine tests.test_mac_logic tests.test_hotkeys -v
      - name: real Apple APIs load (Quartz, AppKit, Carbon TIS)
        run: |
          python - <<'PY'
          from hafuch import platform_mac as pm
          tis = pm._TIS()
          print('current layout:', tis.current())
          import Quartz, AppKit
          print('ok')
          PY
      - name: build Hafuch.app
        run: sh build_mac.sh
      # ditto keeps the symlinks inside the app; plain zip breaks them (and the signature)
      - run: cd dist && ditto -c -k --sequesterRsrc --keepParent Hafuch.app Hafuch-mac.zip
      - name: the zip opens to a validly signed app
        run: |
          mkdir /tmp/check && ditto -x -k dist/Hafuch-mac.zip /tmp/check
          codesign --verify --deep --strict --verbose=2 /tmp/check/Hafuch.app
      # A release, not an artifact: artifacts count against the account's Actions storage (full).
      - name: publish to release "mac-latest"
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release view mac-latest >/dev/null 2>&1 ||             gh release create mac-latest --title "Hafuch for Mac (latest build, untested on a real Mac by a person)"               --notes "Built automatically on every push. Not notarized by Apple: after the first try, System Settings > Privacy & Security > Open Anyway." --prerelease
          gh release upload mac-latest dist/Hafuch-mac.zip --clobber
