# Builds and checks the Mac version on GitHub's Mac machines (no Mac needed).
# Runs only if this folder is pushed to its own GitHub repo.
name: mac
on: [push, workflow_dispatch]
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: unit tests + simulated-Mac tests
        run: python -m unittest tests.test_engine tests.test_mac_logic -v
      - name: real Apple APIs load (Quartz, AppKit, Carbon TIS)
        run: |
          python - <<'PY'
          from hafuch import platform_mac as pm
          tis = pm._TIS()
          print('current layout:', tis.current())
          import Quartz, AppKit
          print('ok')
          PY
      - name: build Hafuch.app
        run: sh build_mac.sh
      - run: cd dist && zip -qr Hafuch-mac.zip Hafuch.app
      - uses: actions/upload-artifact@v4
        with: {name: Hafuch-mac, path: dist/Hafuch-mac.zip}
